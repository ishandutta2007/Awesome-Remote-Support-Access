<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.6" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .grid-line {
      stroke: #334155;
      stroke-opacity: 0.25;
      stroke-width: 1;
    }
    
    /* Dynamic Network Signal Flow Animation */
    @keyframes pulsePath {
      0% { stroke-dashoffset: 400; opacity: 0.2; }
      50% { opacity: 0.9; }
      100% { stroke-dashoffset: 0; opacity: 0.2; }
    }

    @keyframes floatParticle {
      0% { transform: translateY(0px) scale(1); opacity: 0.3; }
      50% { transform: translateY(-12px) scale(1.2); opacity: 0.8; }
      100% { transform: translateY(0px) scale(1); opacity: 0.3; }
    }

    @keyframes beaconRing {
      0% { r: 4; opacity: 0.9; }
      100% { r: 24; opacity: 0; }
    }

    @keyframes orbitPill {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
      100% { transform: translateY(0px); }
    }

    .pulse-line {
      stroke-dasharray: 20, 10;
      animation: pulsePath 6s linear infinite;
    }

    .particle {
      animation: floatParticle 4s ease-in-out infinite;
    }

    .beacon {
      animation: beaconRing 2.5s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
    }

    .orbit-1 { animation: orbitPill 4s ease-in-out infinite; }
    .orbit-2 { animation: orbitPill 4.5s ease-in-out 0.8s infinite; }
    .orbit-3 { animation: orbitPill 5s ease-in-out 1.6s infinite; }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGradient)" />

  <!-- Geometric Grid & Constellations -->
  <g opacity="0.4">
    <line x1="0" y1="60" x2="1200" y2="60" class="grid-line" />
    <line x1="0" y1="120" x2="1200" y2="120" class="grid-line" />
    <line x1="0" y1="180" x2="1200" y2="180" class="grid-line" />
    <line x1="0" y1="240" x2="1200" y2="240" class="grid-line" />
    <line x1="0" y1="300" x2="1200" y2="300" class="grid-line" />
    <line x1="150" y1="0" x2="150" y2="360" class="grid-line" />
    <line x1="300" y1="0" x2="300" y2="360" class="grid-line" />
    <line x1="600" y1="0" x2="600" y2="360" class="grid-line" />
    <line x1="900" y1="0" x2="900" y2="360" class="grid-line" />
    <line x1="1050" y1="0" x2="1050" y2="360" class="grid-line" />
  </g>

  <!-- Background Dynamic Network Connections / Waveflows (in background behind text) -->
  <g>
    <path d="M 50,300 C 250,220 350,340 550,280 S 850,200 1150,260" fill="none" stroke="#0284c7" stroke-width="2.5" class="pulse-line" opacity="0.4" />
    <path d="M 50,80 C 300,160 500,40 750,120 S 950,60 1150,100" fill="none" stroke="#8b5cf6" stroke-width="2.5" class="pulse-line" opacity="0.35" style="animation-duration: 8s;" />
    
    <!-- Dynamic Glowing Nodes / Beacons -->
    <circle cx="150" cy="120" fill="none" stroke="#38bdf8" stroke-width="1.5" class="beacon" />
    <circle cx="150" cy="120" r="4" fill="#38bdf8" filter="url(#softGlow)" />

    <circle cx="1050" cy="100" fill="none" stroke="#c084fc" stroke-width="1.5" class="beacon" style="animation-delay: 1.2s;" />
    <circle cx="1050" cy="100" r="4" fill="#c084fc" filter="url(#softGlow)" />

    <circle cx="950" cy="270" fill="none" stroke="#38bdf8" stroke-width="1.5" class="beacon" style="animation-delay: 0.6s;" />
    <circle cx="950" cy="270" r="4" fill="#38bdf8" filter="url(#softGlow)" />
  </g>

  <!-- Floating Ambient Particles -->
  <circle cx="100" cy="200" r="3" fill="#38bdf8" class="particle" style="animation-duration: 5s;" />
  <circle cx="220" cy="70" r="2" fill="#818cf8" class="particle" style="animation-duration: 6s; animation-delay: 1s;" />
  <circle cx="1080" cy="220" r="3" fill="#f43f5e" class="particle" style="animation-duration: 4.5s; animation-delay: 0.5s;" />
  <circle cx="880" cy="80" r="2.5" fill="#34d399" class="particle" style="animation-duration: 5.5s; animation-delay: 2s;" />

  <!-- Foreground Title and Subtitle Area (Clear, prominent, crisp) -->
  <g text-anchor="middle">
    <!-- Top badge / pill -->
    <g transform="translate(600, 48)">
      <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2" />
      <circle cx="-116" cy="0" r="4" fill="#22c55e" />
      <text x="-104" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#93c5fd" letter-spacing="1.5">CURATED ECOSYSTEM DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Remote Support &amp; Access
    </text>

    <!-- Subtitle with Gradient highlight -->
    <text x="600" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="18" font-weight="500" fill="url(#primaryGrad)">
      Production SaaS Benchmarks &bull; High-Performance Open-Source Solutions &bull; Remote Desktop Protocols
    </text>

    <!-- Brief Description line -->
    <text x="600" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="14" font-weight="400" fill="#94a3b8">
      A comprehensive comparison guide for IT helpdesks, DevOps engineers, MSPs, and sysadmins.
    </text>
  </g>

  <!-- Interactive / Floating Info Badges (Positioned cleanly below text) -->
  <g transform="translate(600, 260)">
    <!-- Pill 1: RDP / VNC / WebRTC -->
    <g class="orbit-1" transform="translate(-320, 0)">
      <rect x="-95" y="-18" width="190" height="36" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" filter="url(#glow)" />
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">⚡ RDP &bull; VNC &bull; WebRTC</text>
    </g>

    <!-- Pill 2: Self-Hosted & Privacy -->
    <g class="orbit-2" transform="translate(0, 0)">
      <rect x="-105" y="-18" width="210" height="36" rx="10" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.2" filter="url(#glow)" />
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">🔒 Self-Hosted &amp; Zero Trust</text>
    </g>

    <!-- Pill 3: Enterprise & MSP Ready -->
    <g class="orbit-3" transform="translate(320, 0)">
      <rect x="-100" y="-18" width="200" height="36" rx="10" fill="url(#cardGrad)" stroke="#34d399" stroke-width="1.2" filter="url(#glow)" />
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle">🏢 Enterprise &amp; MSP Ready</text>
    </g>
  </g>

  <!-- Decorative Border Outline -->
  <rect x="0.5" y="0.5" width="1199" height="359" rx="16" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.6" />
</svg>
