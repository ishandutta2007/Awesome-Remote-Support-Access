<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Header Gradient Text -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Card Fill Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Glow Accent Filters -->
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Backdrop with Border -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGradient)" stroke="#334155" stroke-width="1.5" />

  <!-- Background Subtle Grid -->
  <g stroke="#334155" stroke-opacity="0.25" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Background Dynamic Network Stream Lines with SMIL Animation -->
  <g>
    <!-- Cyan Data Wave -->
    <path d="M 50,300 C 250,220 350,340 550,280 S 850,200 1150,260" fill="none" stroke="#0284c7" stroke-width="2.5" stroke-opacity="0.45" stroke-dasharray="16,8">
      <animate attributeName="stroke-dashoffset" from="300" to="0" dur="8s" repeatCount="indefinite" />
    </path>

    <!-- Violet Connection Wave -->
    <path d="M 50,80 C 300,160 500,40 750,120 S 950,60 1150,100" fill="none" stroke="#8b5cf6" stroke-width="2.5" stroke-opacity="0.4" stroke-dasharray="20,10">
      <animate attributeName="stroke-dashoffset" from="0" to="300" dur="10s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Dynamic Pulsing Network Beacons -->
  <g>
    <!-- Beacon 1 -->
    <circle cx="150" cy="120" fill="none" stroke="#38bdf8" stroke-width="1.5">
      <animate attributeName="r" values="3;22;3" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.9;0;0.9" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="150" cy="120" r="4.5" fill="#38bdf8" filter="url(#softGlow)" />

    <!-- Beacon 2 -->
    <circle cx="1050" cy="100" fill="none" stroke="#c084fc" stroke-width="1.5">
      <animate attributeName="r" values="3;22;3" dur="3.5s" begin="1s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.9;0;0.9" dur="3.5s" begin="1s" repeatCount="indefinite" />
    </circle>
    <circle cx="1050" cy="100" r="4.5" fill="#c084fc" filter="url(#softGlow)" />

    <!-- Beacon 3 -->
    <circle cx="980" cy="280" fill="none" stroke="#34d399" stroke-width="1.5">
      <animate attributeName="r" values="3;20;3" dur="2.8s" begin="0.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.9;0;0.9" dur="2.8s" begin="0.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="980" cy="280" r="4" fill="#34d399" filter="url(#softGlow)" />
  </g>

  <!-- Floating Signal Particles with SMIL Animations -->
  <circle cx="100" cy="220" r="3" fill="#38bdf8" opacity="0.6">
    <animate attributeName="cy" values="220;205;220" dur="4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="1100" cy="210" r="3.5" fill="#f43f5e" opacity="0.6">
    <animate attributeName="cy" values="210;195;210" dur="4.5s" begin="0.8s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="4.5s" begin="0.8s" repeatCount="indefinite" />
  </circle>
  <circle cx="240" cy="65" r="2.5" fill="#818cf8" opacity="0.5">
    <animate attributeName="cy" values="65;55;65" dur="5s" begin="1.2s" repeatCount="indefinite" />
  </circle>

  <!-- Foreground Title, Subtitle & Branding (Clear and Always Visible) -->
  <g text-anchor="middle">
    <!-- Top Status Badge -->
    <g transform="translate(600, 48)">
      <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2" />
      <circle cx="-116" cy="0" r="4" fill="#22c55e">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="-104" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#93c5fd" letter-spacing="1.5">CURATED ECOSYSTEM DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Remote Support &amp; Access
    </text>

    <!-- Subtitle with Gradient highlight -->
    <text x="600" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="18" font-weight="600" fill="url(#primaryGrad)">
      Production SaaS Benchmarks &#8226; High-Performance Open-Source Solutions &#8226; Remote Desktop Protocols
    </text>

    <!-- Brief Description Line -->
    <text x="600" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="14" font-weight="400" fill="#94a3b8">
      A comprehensive comparison guide for IT helpdesks, DevOps engineers, MSPs, and sysadmins.
    </text>
  </g>

  <!-- Three Prominent Dynamic Feature Cards (Positioned in lower third) -->
  <g transform="translate(600, 265)">
    <!-- Card 1: Protocols -->
    <g transform="translate(-320, 0)">
      <rect x="-100" y="-20" width="200" height="40" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.4" />
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc" text-anchor="middle">⚡ RDP &#8226; VNC &#8226; WebRTC</text>
      <animateTransform attributeName="transform" type="translate" values="-320,0; -320,-4; -320,0" dur="4s" repeatCount="indefinite" />
    </g>

    <!-- Card 2: Privacy / Zero Trust -->
    <g transform="translate(0, 0)">
      <rect x="-110" y="-20" width="220" height="40" rx="10" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.4" />
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc" text-anchor="middle">🔒 Self-Hosted &amp; Zero Trust</text>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-5; 0,0" dur="4.5s" begin="0.8s" repeatCount="indefinite" />
    </g>

    <!-- Card 3: Enterprise / MSP -->
    <g transform="translate(320, 0)">
      <rect x="-105" y="-20" width="210" height="40" rx="10" fill="url(#cardGrad)" stroke="#34d399" stroke-width="1.4" />
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc" text-anchor="middle">🏢 Enterprise &amp; MSP Ready</text>
      <animateTransform attributeName="transform" type="translate" values="320,0; 320,-4; 320,0" dur="5s" begin="1.6s" repeatCount="indefinite" />
    </g>
  </g>
</svg>
